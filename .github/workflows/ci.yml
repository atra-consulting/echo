name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 'Build and test'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      # Node 22 bringt npm 10 mit, wie das Docker-Image (node:22-alpine). Damit schlägt
      # npm ci hier fehl, wenn package-lock.json mit npm 10 nicht installierbar ist.
      - name: 'Setup node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Build'
        run: npm run build

      - name: 'Test'
        run: npx ng test --watch=false --browsers=ChromeHeadless
