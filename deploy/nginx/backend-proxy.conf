# Settings shared by all locations forwarded to the backend. The Host header
# stays the default ($proxy_host, the loopback upstream): the backend only
# accepts loopback and its public host name (protection against DNS rebinding).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
# MCP may stream (Streamable HTTP); buffering would hold responses back.
proxy_buffering off;
proxy_read_timeout 300s;
