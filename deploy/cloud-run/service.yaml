# The Zeugnisgenerator as one Cloud Run service with two containers: "web"
# (nginx with the web app, the only ingress) and "api" (backend: REST API and
# MCP server). They share the network namespace of the instance; nginx reaches
# the backend on 127.0.0.1:8081. Same containers as in compose.yaml.
#
# .github/workflows/deploy.yml fills in these placeholders and applies the
# file with `gcloud run services replace`:
#   IMAGE_REGISTRY   Artifact Registry of the project (secret AR_REGISTRY)
#   IMAGE_TAG        the commit that was built
#   SERVICE_ACCOUNT  runtime service account the service runs under today
#                    (read from the live service, so the deploy does not switch it)
#   IAP_AUDIENCE     /projects/<number>/locations/europe-west1/services/echo
#   REVISION         a name per deploy run, see below
#
# `services replace` replaces the whole service. The settings the GCP
# self-service of atra.consulting made (ingress, IAP directly on the service,
# invoker check on) are therefore restated here; left out, the replace would
# switch IAP off.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  # The infrastructure keeps the old name echo, independent of the app name.
  name: echo
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/iap-enabled: "true"
spec:
  template:
    metadata:
      # Every deploy makes a revision, also a re-run of the same commit: a
      # rotated secret (key: latest) only arrives with a new revision.
      name: ${REVISION}
      annotations:
        # Scale to zero stays (no minScale); the start gets more CPU instead.
        run.googleapis.com/startup-cpu-boost: "true"
        # nginx starts only once the backend passed its startup probe.
        run.googleapis.com/container-dependencies: '{"web": ["api"]}'
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: web
          image: ${IMAGE_REGISTRY}/echo:${IMAGE_TAG}
          # The only container with a port: it gets the traffic and PORT.
          ports:
            - name: http1
              containerPort: 8080
          # Together with the backend one CPU per instance.
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: 8080

        - name: api
          image: ${IMAGE_REGISTRY}/echo-api:${IMAGE_TAG}
          env:
            - name: API_PORT
              value: "8081"
            # Not reachable from outside the instance (only the web port is);
            # listening on all interfaces lets the startup probe reach it.
            # The IAP check below protects /api in any case.
            - name: HOST
              value: 0.0.0.0
            - name: IAP_AUDIENCE
              value: ${IAP_AUDIENCE}
            # /mcp behind IAP, without a sign-in of its own: the backend requires
            # the verified IAP assertion, the owner of the drafts is its email.
            # Local agents (e.g. Claude Code) send an ID token for IAP's
            # programmatic access; claude.ai connectors cannot pass IAP.
            - name: MCP_AUTH
              value: none
            # Cloud Run's front end and nginx: the client is the second-to-last X-Forwarded-For entry.
            - name: TRUST_PROXY
              value: "2"
            # Drafts per user in Firestore, encrypted with the key ring from
            # Secret Manager. Without a valid key ring the backend does not start.
            - name: DRAFT_STORE
              value: firestore
            - name: RETENTION_DAYS
              value: "90"
            - name: DRAFT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: draft-encryption-key
                  key: latest
          resources:
            limits:
              cpu: 750m
              # Node with the gRPC client of Firestore.
              memory: 512Mi
          # TCP, not HTTP: the port opens only once the backend is wired, and no
          # Host header can make the probe fail. compose.yaml checks /api/health
          # with the container IP as Host, as an HTTP probe would.
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 2
            failureThreshold: 15
