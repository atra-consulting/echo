<div (click)="disabled() && (showDisabledHint = true)">
    <mat-form-field style="width: 100%">
        <mat-label>Auswahl Textbaustein</mat-label>
        <mat-select id="intro_options" name="intro_options" (selectionChange)="onSelect($event.value)" [(ngModel)]="selectedTextBlock" [disabled]="disabled()">
            @for ( option of options(); track option; let index = $index) {
            <mat-option [value]="option">{{ dataStorageService.replacePlaceholders(option) }}</mat-option>
            }
        </mat-select>
        @if (showDisabledHint && disabled()) {
            <mat-hint class="hint-warning">Bitte zuerst eine Bewertung auswählen</mat-hint>
        }
    </mat-form-field>
</div>
