<div class="flex-row">
    <mat-radio-group aria-label="Bewertung" [(ngModel)]="selectedOption.rating">
        @for (option of options(); track option; let index = $index) { @if (options()[index].title) {
        <ng-container>
            <mat-radio-button class="radio-button" [value]="option.title" (change)="radioChange($event)">{{ option.title }}
            </mat-radio-button>
        </ng-container>
        } }
    </mat-radio-group>
</div>
<app-block-selector [options]="
    dataStorageService.refreshData(
      selectedOption.options?.length ? selectedOption.options : []
    )
  " [topicKey]="topicKey()" [subtopicKey]="subtopicKey()" [selectedOption]="selectedOption" [disabled]="!selectedOption.rating"></app-block-selector>
@if (selectedOption.description) {
<mat-hint>{{ selectedOption.description }}
</mat-hint>
}
